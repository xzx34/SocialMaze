name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel outside the checkout and run the complete offline workflow
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "$wheel"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          socialmaze-hrd generate -n 6 --variant full -N 8 --seed 20260920 --out sample.jsonl --quiet
          socialmaze-hrd solve sample.jsonl
          socialmaze-hrd evaluate --data sample.jsonl --models mock --out run --quiet
          socialmaze-hrd report run --quiet
          test -s run/summary.json
          test -s run/report.md
