[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialmaze"
version = "1.0.0"
description = "Hidden Role Deduction for evaluating LLM social reasoning under dynamic interaction, deception, and information uncertainty"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zixiang Xu" }]
keywords = [
  "benchmark",
  "LLM evaluation",
  "social reasoning",
  "social intelligence",
  "theory of mind",
  "social deduction",
  "hidden role deduction",
  "multi-turn reasoning",
  "dynamic interaction",
  "deception",
  "information uncertainty",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
dependencies = [
  "openai>=1.30",
  "pyyaml>=6.0",
  "tqdm>=4.60",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
hf = ["datasets>=2.14"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://xzx34.github.io/socialmaze/"
Paper = "https://arxiv.org/abs/2505.23713"
Dataset = "https://huggingface.co/datasets/xzx34/SocialMaze"
Repository = "https://github.com/xzx34/SocialMaze"

[project.scripts]
socialmaze-hrd = "socialmaze.hrd.cli:main"

[tool.setuptools.packages.find]
include = ["socialmaze*"]

[tool.setuptools.package-data]
socialmaze = ["configs/models.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
